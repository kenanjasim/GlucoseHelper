name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlucoseHelper-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "GlucoseHelper-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "GlucoseHelper-${GITHUB_REF_NAME}.apk" \
            --title "GlucoseHelper $GITHUB_REF_NAME" \
            --generate-notes
